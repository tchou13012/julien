<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn-insta {
            display: inline-block;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .btn-insta:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Votre phrase personnalisée ici -->
    <h1>Salut, je suis Julien, je suis hétéro, célibataire, sportif et parfois alcoolique !!</h1> 
    </h1>Aborde moi qu’on en discute.</h1>

    
    <!-- Votre lien Instagram ici -->
    <a href="https://instagram.com/julienpyd" class="btn-insta" target="_blank">Viens me voir..</a>

</body>
</html>
